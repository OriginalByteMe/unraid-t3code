name: build

# Every push and pull request builds and smoke-tests the image at the T3 Code
# version pinned in the Dockerfile. A push to main publishes it to each
# registry that has no image for that version yet, which is what merging a
# t3-bump pull request does. A manual run with `publish` ticked publishes it
# regardless. Docker Hub gets a copy because Community Apps reads an image's
# Last Update date from Docker Hub, even for images on GHCR.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested image to GHCR and Docker Hub (adds :latest on main)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/originalbyteme/unraid-t3code
  HUB_IMAGE: docker.io/originalbyteme/unraid-t3code

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          shellcheck entrypoint.sh
          python3 -c 'import sys, xml.etree.ElementTree as E; [E.parse(f) for f in sys.argv[1:]]' templates/*.xml ca_profile.xml

      - name: Build
        run: |
          echo "VERSION=$(sed -n 's/^ARG T3CODE_VERSION=//p' Dockerfile)" >> "$GITHUB_ENV"
          docker build -t unraid-t3code:test .

      - name: PUID and PGID move the t3code account
        run: |
          ids=$(docker run --rm -e PUID=1234 -e PGID=4321 unraid-t3code:test sh -c 'echo "$(id -u):$(id -g)"')
          echo "$ids"
          test "$ids" = 1234:4321

      - name: Agents can use a mapped Docker socket
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock unraid-t3code:test docker ps

      - name: Agent names install their npm packages, and omp runs on Bun
        run: docker run --rm -e AGENTS='OMP, claude' unraid-t3code:test sh -c 'omp --version && claude --version'

      # The Chrome build this T3 Code release downloads, run the way T3 runs it
      # in the container (no sandbox), against the image's libraries and fonts.
      - name: T3's browser starts and renders text
        run: |
          chrome=$(curl -fsSL "https://raw.githubusercontent.com/pingdotgg/t3code/v$VERSION/apps/server/src/preview/PreviewBrowser.ts" \
            | sed -n 's/^const VERSION = "\(.*\)";$/\1/p')
          test -n "$chrome"
          docker run --rm -e CHROME="$chrome" unraid-t3code:test sh -c '
            cd /tmp &&
            curl -fsSL -o chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/$CHROME/linux64/chrome-headless-shell-linux64.zip" &&
            unzip -q chrome.zip &&
            fc-match sans-serif &&
            chrome-headless-shell-linux64/chrome-headless-shell --no-sandbox --dump-dom "data:text/html,<p>rendered</p>"' > chrome.out
          cat chrome.out
          grep -q '<p>rendered</p>' chrome.out

      - name: Server starts, pairs a client and lists GIT_REPOS as a project across restarts
        run: |
          docker run -d --name t3 -p 3773:3773 \
            -e GIT_REPOS=octocat/Hello-World -e SHELL=zsh -e OH_MY_ZSH=true unraid-t3code:test
          ready() {
            for _ in $(seq 90); do
              docker logs t3 > t3.log 2>&1
              [ "$(grep -c 'T3 Code server is ready' t3.log)" -ge "$1" ] && return
              sleep 2
            done
            return 1
          }
          ready 1 || true
          docker restart t3
          ready 2 || true
          # The log carries live pairing tokens; keep them out of this public log.
          grep -v -e 'Token:' -e 'token=' -e 'token%3D' t3.log || true
          test "$(grep -c 'T3 Code server is ready' t3.log)" = 2
          test "$(grep -c 'added /projects/Hello-World to T3 Code' t3.log)" = 1
          test "$(grep -c '\[unraid-t3code\] WARNING' t3.log)" = 0
          curl -fsS http://127.0.0.1:3773/ | grep -q '<title>T3 Code'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3773/api/projects)" = 401
          token=$(docker exec -u t3code t3 t3 auth pairing create --json | jq -r .credential)
          curl -fsS -c jar -H 'content-type: application/json' -d "{\"credential\":\"$token\"}" \
            http://127.0.0.1:3773/api/auth/browser-session | jq -e .authenticated
          curl -fsS -b jar http://127.0.0.1:3773/api/projects | jq -e '[.. | .workspaceRoot? // empty] | index("/projects/Hello-World")'
          test "$(docker exec t3 stat -c %u /projects/Hello-World)" = 99
          test "$(docker exec t3 getent passwd t3code | cut -d: -f7)" = /usr/bin/zsh
          docker exec t3 test -f /home/t3code/.oh-my-zsh/oh-my-zsh.sh

      - name: Publish
        if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u originalbyteme --password-stdin
          for image in "$IMAGE" "$HUB_IMAGE"; do
            if [ "$GITHUB_EVENT_NAME" = push ] && docker manifest inspect "$image:$VERSION" >/dev/null 2>&1; then
              echo "$image:$VERSION is already published"
              continue
            fi
            tags="$image:$VERSION"
            if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags $image:latest"; fi
            for tag in $tags; do
              docker tag unraid-t3code:test "$tag"
              docker push "$tag"
            done
          done

name: t3-bump

# Every 6 hours, compares T3 Code's latest stable release with the version
# pinned in the Dockerfile. When it is newer, opens a pull request that bumps
# the pin, closes older bump pull requests, and runs build.yml on the branch,
# since a pull request opened with the workflow token does not trigger it.
# Closing a bump pull request skips that version. Merging one publishes the image.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG T3CODE_VERSION=//p' Dockerfile)
          # The latest release, which excludes nightlies and other prereleases.
          latest=$(gh release view --repo pingdotgg/t3code --json tagName -q .tagName)
          latest=${latest#v}
          if [ "$(printf '%s\n' "$pinned" "$latest" | sort -V | tail -n1)" = "$pinned" ]; then
            echo "T3 Code $pinned is the latest release"
            exit 0
          fi
          branch=t3-$latest
          if [ -n "$(gh pr list --head "$branch" --state all --json number -q '.[].number')" ]; then
            echo "$branch already has a pull request"
            exit 0
          fi
          sed -i "s/^ARG T3CODE_VERSION=.*/ARG T3CODE_VERSION=$latest/" Dockerfile
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qam "T3 Code $latest"
          git push -qf origin "$branch"
          gh pr list --state open --json number,headRefName -q '.[] | select(.headRefName | test("^t3-[0-9]")) | .number' |
            while read -r pr; do gh pr close "$pr" --delete-branch --comment "Superseded by T3 Code $latest."; done
          gh pr create --head "$branch" --title "T3 Code $latest" \
            --body "Bumps T3 Code from $pinned to $latest. Release notes: https://github.com/pingdotgg/t3code/releases/tag/v$latest"
          gh workflow run build.yml --ref "$branch"
